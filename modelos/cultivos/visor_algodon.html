names.forEach(k=>{G[k].visible=all||k===n;G[k].position.set(0,0,0)});
if(all){const filas=new Map();names.forEach(k=>{const q=fam(k);if(!filas.has(q))filas.set(q,[]);filas.get(q).push(k)});let z=0;
for(const fila of filas.values()){let x=0,d=.5;for(const k of fila){const b=new THREE.Box3().setFromObject(G[k]);const w=Math.max(b.max.x-b.min.x,.5);
G[k].position.set(x-(b.min.x+b.max.x)/2,0,z-(b.min.z+b.max.z)/2);x+=w+gap*.6;d=Math.max(d,b.max.z-b.min.z)}z+=d+gap*.6}}
const box=new THREE.Box3();names.forEach(k=>{if(G[k].visible)box.expandByObject(G[k])});const sph=box.getBoundingSphere(new THREE.Sphere());
const vf=cam.fov*Math.PI/180,hf=2*Math.atan(Math.tan(vf/2)*cam.aspect),dist=Math.max(sph.radius,.5)*1.25/Math.sin(Math.min(vf,hf)/2);
ctl.target.copy(sph.center);cam.position.copy(sph.center).addScaledVector(new THREE.Vector3(1,.9,1.3).normalize(),dist);
document.getElementById('t').textContent=all?'Todos':n;let k=0;names.forEach(q=>{if(G[q].visible)k+=DATA[q].length});document.getElementById('c').textContent=k+' cubos'}
for(const n of[...names,'todos']){const b=document.createElement('button');b.textContent=n;b.onclick=()=>set(n);ui.append(b);btn[n]=b}
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});
addEventListener('keydown',e=>{const a=[...names,'todos'],i=a.findIndex(q=>btn[q].classList.contains('on'));if(e.key==='ArrowRight')set(a[(i+1)%a.length]);if(e.key==='ArrowLeft')set(a[(i+a.length-1)%a.length])});
set('todos');window.__visorListo=true;document.getElementById('aviso').hidden=true;(function f(){requestAnimationFrame(f);ctl.update();r.render(scene,cam)})();</script></body></html>
