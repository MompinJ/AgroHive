# Server block de AgroHive en el droplet: /etc/nginx/sites-available/agrohive (enlazado en sites-enabled).
# No toca el bloque de mediworks. El hostname usa sslip.io (sin dominio propio, docs/13).
server {
    listen 80;
    listen [::]:80;
    server_name 64-23-143-102.sslip.io;
    location /.well-known/acme-challenge/ { root /var/www/agrohive-acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 64-23-143-102.sslip.io;

    ssl_certificate /etc/letsencrypt/live/agrohive/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agrohive/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API: FastAPI en 127.0.0.1:8010 (systemd agrohive-api)
    location /api/ { proxy_pass http://127.0.0.1:8010; include /etc/nginx/agrohive-proxy.conf; }
    location = /health { proxy_pass http://127.0.0.1:8010; include /etc/nginx/agrohive-proxy.conf; }
    location /docs { proxy_pass http://127.0.0.1:8010; include /etc/nginx/agrohive-proxy.conf; }
    location = /openapi.json { proxy_pass http://127.0.0.1:8010; include /etc/nginx/agrohive-proxy.conf; }

    # Front: build de web/ (navegacion por hash, no necesita reescritura)
    root /var/www/agrohive-web;
    index index.html;
    location /assets/ { expires 7d; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }
}
