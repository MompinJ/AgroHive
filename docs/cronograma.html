<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgroHive - Actividades</title>
<style>
:root{--bg:#f6f5ef;--card:#fff;--tx:#1d2a1f;--mut:#5d6b60;--bd:#dcdccf;--ac:#2f7d4f;--ac2:#e8f2ea;--warn:#b5651d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a15;--card:#1c241e;--tx:#e8efe9;--mut:#9aab9e;--bd:#2d3a30;--ac:#5fbf86;--ac2:#22332a;--warn:#e0a060}}
:root[data-theme="dark"]{--bg:#141a15;--card:#1c241e;--tx:#e8efe9;--mut:#9aab9e;--bd:#2d3a30;--ac:#5fbf86;--ac2:#22332a;--warn:#e0a060}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 60px}
h1{margin:0 0 4px;font-size:1.5rem}
.sub{color:var(--mut);margin:0 0 16px}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0 4px}
.bar>i{display:block;height:100%;background:var(--ac);width:0;transition:width .2s}
.filtros{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.filtros button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 12px;border-radius:16px;cursor:pointer;font:inherit}
.filtros button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.filtros .sep{width:1px;background:var(--bd);margin:0 4px}
h2{font-size:1.1rem;margin:26px 0 8px;border-bottom:2px solid var(--ac);padding-bottom:4px}
.act{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:8px 0}
.act.done{opacity:.55}.act.done .t{text-decoration:line-through}
.act input{width:20px;height:20px;margin-top:2px;accent-color:var(--ac)}
.t{font-weight:600}.t small{color:var(--mut);font-weight:400;margin-right:6px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag{background:var(--ac2);border-radius:10px;padding:1px 9px;font-size:.8rem}
.tag.L,.tag.XL{background:var(--warn);color:#fff}
.tag.mod-Fable{background:#5b3fa0;color:#fff}.tag.mod-Opus{background:#2b5c8a;color:#fff}
.det{color:var(--mut);font-size:.88rem;margin-top:4px}
.gate{border-left:4px solid var(--warn);background:var(--card);padding:8px 12px;margin:8px 0;border-radius:0 8px 8px 0;font-size:.9rem}
.gate b{color:var(--warn)}
.vacio{color:var(--mut);font-style:italic}
</style>
</head>
<body>
<main>
<h1>AgroHive - Actividades</h1>
<p class="sub">Esfuerzo medido en IA, sin horas. Fuente: <code>docs/14-CRONOGRAMA.md</code>. Las marcas se guardan solo en este navegador.</p>
<div id="prog"></div>
<div class="bar"><i id="barra"></i></div>
<div class="sub" id="txt"></div>
<div class="filtros" id="filtros"></div>
<div id="lista"></div>
<h2>Compuertas (puntos de corte)</h2>
<div id="gates"></div>
</main>
<script>
const D = {"fases": [{"id": "F0", "nombre": "Arranque", "acts": [{"id": "A0.1", "act": "Repo Git con 5 ramas y estructura de carpetas", "rol": "Mompin", "esf": "XS", "mod": "Haiku", "dep": "—", "ent": "Repo remoto con main y 4 ramas"}, {"id": "A0.2", "act": "Documentación consolidada en docs/", "rol": "Mompin", "esf": "S", "mod": "Haiku", "dep": "—", "ent": "docs/ al día, registro en 01"}, {"id": "A0.3", "act": "Acordar roles, cultivos iniciales y criterio de ranking (V-18, V-19)", "rol": "Todos", "esf": "XS", "mod": "Haiku", "dep": "—", "ent": "Acta breve en 11"}, {"id": "A0.4", "act": "Acceso SSH, firewall y hostname del servidor (V-15 a V-17)", "rol": "R3 / Eduardo", "esf": "S", "mod": "Sonnet", "dep": "—", "ent": "https://<host>/health responde"}, {"id": "A0.5", "act": "Verificar reglas de entrega, IA y video (V-03, V-04)", "rol": "R4", "esf": "XS", "mod": "Haiku", "dep": "—", "ent": "Notas en 11"}, {"id": "A0.6", "act": "Consultar SIAP: cultivos y calendario del municipio; confirmar zona demo y milpa (V-20)", "rol": "R3", "esf": "S", "mod": "Sonnet", "dep": "—", "ent": "Zona y cultivos confirmados en 13"}, {"id": "A0.7", "act": "Verificar Open-Meteo estacional, CORS de POWER y acceso a elevación (V-21, V-22)", "rol": "R3", "esf": "S", "mod": "Sonnet", "dep": "—", "ent": "Parámetros probados con una llamada real, anotados en 04"}]}, {"id": "F1", "nombre": "Contratos y esqueleto", "acts": [{"id": "A1.1", "act": "Contratos de datos (parcela, clima, plan, resultado) como JSON Schema y tipos TS", "rol": "R2 + R3", "esf": "M", "mod": "Opus", "dep": "A0.3", "ent": "contratos/ revisado por los 4"}, {"id": "A1.2", "act": "Esqueleto web/: React + Vite + TS, Worker del motor, rutas P0 a P3 vacías", "rol": "R1", "esf": "S", "mod": "Sonnet", "dep": "A1.1", "ent": "npm run dev abre las pantallas"}, {"id": "A1.3", "act": "Esqueleto api/: FastAPI, /health, OpenAPI, generación del cliente TS", "rol": "R3", "esf": "S", "mod": "Sonnet", "dep": "A1.1", "ent": "Cliente TS generado compila"}, {"id": "A1.4", "act": "Paleta compartida y primer modelo de prueba (cultivo 1, una etapa)", "rol": "R4", "esf": "M", "mod": "Sonnet", "dep": "A0.3", "ent": ".bbmodel abre en Blockbench"}, {"id": "A1.5", "act": "Catálogo propio de cultivos (milpa: maíz, frijol, calabaza; más 3 a 5 si hay tiempo) sembrado desde EcoCrop y FAO-56: ciclo, etapas, Kc y umbrales con fuente", "rol": "R3", "esf": "M", "mod": "Opus", "dep": "A0.3", "ent": "JSON con citas; vacíos como NO_EVALUABLE"}, {"id": "A1.6", "act": "Tabla de suelos (TAW por textura, FAO-56)", "rol": "R3", "esf": "S", "mod": "Sonnet", "dep": "—", "ent": "JSON con fuente"}]}, {"id": "F2", "nombre": "Datos y motor (en paralelo)", "acts": [{"id": "A2.1", "act": "Cliente NASA POWER diario con caché y reintentos", "rol": "R3", "esf": "M", "mod": "Sonnet", "dep": "A1.3", "ent": "GET /api/clima devuelve serie real (C1)"}, {"id": "A2.2", "act": "Respaldo Open-Meteo y estados RESPALDO_HISTORICO / ERROR_DATOS", "rol": "R3", "esf": "S", "mod": "Sonnet", "dep": "A2.1", "ent": "Se activa al apagar POWER"}, {"id": "A2.3", "act": "Elevación por celda (tiles Terrarium o SRTM) y pendiente", "rol": "R3", "esf": "M", "mod": "Sonnet", "dep": "A1.3", "ent": "GET /api/elevacion por polígono"}, {"id": "A2.4", "act": "Paquete de demo precargado (Isla, 2 ha, clima 2006 a 2025, elevación)", "rol": "R3", "esf": "S", "mod": "Sonnet", "dep": "A2.1, A2.3", "ent": "Demo funciona sin internet"}, {"id": "A2.5", "act": "Selección de escenarios seco / habitual / lluvioso (p10, p50, p90)", "rol": "R2", "esf": "M", "mod": "Opus", "dep": "A1.1", "ent": "Años reales visibles y reproducibles"}, {"id": "A2.6", "act": "ET0, ETc y balance de agua por bloque (cubeta)", "rol": "R2", "esf": "L", "mod": "Fable", "dep": "A1.1, A1.5, A1.6", "ent": "Pruebas 1 a 5 de doc 05 en verde"}, {"id": "A2.7", "act": "Pilar de déficit hídrico y estados de evaluabilidad", "rol": "R2", "esf": "M", "mod": "Opus", "dep": "A2.6", "ent": "Métricas por rotación y escenario"}, {"id": "A2.8", "act": "Decisión: cómo se asigna clima a cada ciclo (doc 05, paso 2)", "rol": "R2 + R3", "esf": "M", "mod": "Opus", "dep": "A2.1, A1.5", "ent": "Opción elegida registrada en 01"}, {"id": "A2.9", "act": "Cuadrícula desde polígono (Turf.js) con tope de celdas", "rol": "R1", "esf": "M", "mod": "Sonnet", "dep": "A1.2", "ent": "Polígono dibujado genera celdas"}, {"id": "A2.10", "act": "Mapa y dibujo de polígono libre (Leaflet)", "rol": "R1", "esf": "M", "mod": "Sonnet", "dep": "A1.2", "ent": "El usuario dibuja y ve su parcela (P1)"}, {"id": "A2.11", "act": "Cultivos 1 a 3 completos, todas las etapas y estados de estrés", "rol": "R4", "esf": "L", "mod": "Opus", "dep": "A1.4", "ent": "Modelos probados en la escena real (V-14)"}, {"id": "A2.12", "act": "Bloques de suelo por tipo y humedad", "rol": "R4", "esf": "S", "mod": "Sonnet", "dep": "A1.4", "ent": "Variantes en modelos/"}, {"id": "A2.13", "act": "Capa \"próxima temporada aproximada\": anomalía del pronóstico estacional sobre la climatología, con respaldo estadístico (percentiles y tendencia); salida como banda de incertidumbre", "rol": "R2 + R3", "esf": "M", "mod": "Opus", "dep": "A2.1, A2.5, A0.7", "ent": "Rango plausible por mes para la zona demo, etiquetado como aproximado. Después del motor; no bloquea el MVP"}, {"id": "A2.14", "act": "Textura y pH estimados de la zona (ISRIC WCS u OpenLandMap) por script offline y servidos desde caché", "rol": "R3", "esf": "M", "mod": "Sonnet", "dep": "A1.3, A0.7", "ent": "GET /api/suelo devuelve textura y pH con etiqueta SUPUESTO; respaldo manual (V-23)"}]}, {"id": "F3", "nombre": "Escena y selector", "acts": [{"id": "A3.1", "act": "Escena 3D con relieve (altura por bloque, InstancedMesh)", "rol": "R1", "esf": "L", "mod": "Fable", "dep": "A2.3, A2.9", "ent": "Terreno 3D navegable (C3)"}, {"id": "A3.2", "act": "Cargador de .bbmodel con instancing por cultivo y etapa", "rol": "R1", "esf": "L", "mod": "Opus", "dep": "A2.11", "ent": "Modelos del motor visibles en celdas"}, {"id": "A3.3", "act": "Estados visuales: color + icono + patrón, leyenda", "rol": "R1", "esf": "M", "mod": "Sonnet", "dep": "A3.2", "ent": "Legible con daltonismo"}, {"id": "A3.4", "act": "Selector \"what if\": cultivo por ciclo, rotaciones R0 a R2, escenario", "rol": "R1", "esf": "M", "mod": "Sonnet", "dep": "A2.7", "ent": "Cambiar cultivo invalida y recalcula"}, {"id": "A3.5", "act": "Prueba crítica: R1 + ciclo 2 + seco muestra frijol con su estado", "rol": "R1 + R2", "esf": "S", "mod": "Sonnet", "dep": "A3.4", "ent": "Prueba manual documentada"}, {"id": "A3.6", "act": "Modo 2D ligero con los mismos valores del motor", "rol": "R1", "esf": "M", "mod": "Sonnet", "dep": "A2.7", "ent": "Alternar 2D/3D no cambia métricas"}, {"id": "A3.7", "act": "Pilares 2 y 3 (compatibilidad de ciclo, erosión relativa)", "rol": "R2", "esf": "L", "mod": "Opus", "dep": "A2.7", "ent": "Entran solo si los datos alcanzan"}, {"id": "A3.8", "act": "Tooltips y valores por bloque", "rol": "R1", "esf": "S", "mod": "Sonnet", "dep": "A3.4", "ent": "Toque o hover muestra humedad, déficit, pendiente"}, {"id": "A3.9", "act": "Cultivos 4 en adelante, props y mascota", "rol": "R4", "esf": "M", "mod": "Sonnet", "dep": "A2.11", "ent": "Extras según tiempo"}]}, {"id": "F4", "nombre": "Integración y dashboard", "acts": [{"id": "A4.1", "act": "Dashboard: gráficas de lluvia, demanda y balance (Recharts)", "rol": "R1", "esf": "M", "mod": "Sonnet", "dep": "A2.7", "ent": "Gráficas reales del escenario"}, {"id": "A4.2", "act": "Ranking de rotaciones por robustez (peor caso)", "rol": "R2", "esf": "M", "mod": "Opus", "dep": "A2.7", "ent": "Tabla ordenada con 3 o más rotaciones"}, {"id": "A4.3", "act": "Tarjetas de rotación: por qué, evidencia, beneficios, huecos, riesgos", "rol": "R2 + R1", "esf": "M", "mod": "Sonnet", "dep": "A4.2", "ent": "Plantilla sin LLM funcionando"}, {"id": "A4.4", "act": "Redacción con LLM sobre números ya calculados (opcional)", "rol": "R2", "esf": "S", "mod": "Sonnet", "dep": "A4.3", "ent": "Con respaldo en plantilla"}, {"id": "A4.5", "act": "Pantalla de método, fuentes y advertencias (A1, A3)", "rol": "R1", "esf": "S", "mod": "Sonnet", "dep": "A4.3", "ent": "Fuentes NASA citadas en la interfaz"}, {"id": "A4.6", "act": "Conectar front y API (cliente generado, estados de carga y error)", "rol": "R1 + R3", "esf": "M", "mod": "Opus", "dep": "A2.1, A3.4", "ent": "Flujo P0 a P3 con datos reales"}, {"id": "A4.7", "act": "Despliegue en el droplet (nginx, systemd, SSL)", "rol": "R3 / Eduardo", "esf": "M", "mod": "Sonnet", "dep": "A0.4", "ent": "URL pública con la demo"}, {"id": "A4.8", "act": "Extras NASA: SMAP, GPM o MODIS vía earthaccess (solo si aportan)", "rol": "R3", "esf": "L", "mod": "Opus", "dep": "A2.1", "ent": "Un dataset adicional integrado de verdad"}, {"id": "A4.9", "act": "Interfaz de \"próxima temporada aproximada\": banda de incertidumbre y aviso visible de que no es predicción", "rol": "R1", "esf": "S", "mod": "Sonnet", "dep": "A2.13, A3.4", "ent": "La banda aparece en el dashboard y se puede apagar"}]}, {"id": "F5", "nombre": "Pulido y entrega", "acts": [{"id": "A5.1", "act": "Animaciones mínimas (cambio de modelo por etapa) y deseables (escala, viento)", "rol": "R1 + R4", "esf": "M", "mod": "Sonnet", "dep": "A3.2", "ent": "Transiciones suaves, opción de reducir movimiento"}, {"id": "A5.2", "act": "Slider de meses", "rol": "R1", "esf": "M", "mod": "Sonnet", "dep": "A3.4", "ent": "Reproducir y arrastrar sin acumular animaciones"}, {"id": "A5.3", "act": "Móvil y accesibilidad (táctil, teclado)", "rol": "R1", "esf": "M", "mod": "Sonnet", "dep": "A4.6", "ent": "Operable sin hover"}, {"id": "A5.4", "act": "Medición de requisitos mínimos y fallback WebGL", "rol": "R1", "esf": "S", "mod": "Haiku", "dep": "A3.6", "ent": "Cifra documentada para jueces"}, {"id": "A5.5", "act": "Pruebas de regresión del motor y de contratos", "rol": "R2", "esf": "M", "mod": "Sonnet", "dep": "A4.2", "ent": "Suite en verde"}, {"id": "A5.6", "act": "Guion, video de demo y ensayo", "rol": "R4", "esf": "M", "mod": "Sonnet", "dep": "A4.6", "ent": "Video grabado con respaldo"}, {"id": "A5.7", "act": "README con método, fuentes, límites, licencias y declaración de IA", "rol": "R4", "esf": "S", "mod": "Sonnet", "dep": "A4.5", "ent": "README completo"}, {"id": "A5.8", "act": "Respaldo local sin internet y capturas", "rol": "R3 + R4", "esf": "S", "mod": "Haiku", "dep": "A2.4", "ent": "Demo corre con la red apagada"}, {"id": "A5.9", "act": "Envío final según reglas oficiales", "rol": "R4", "esf": "XS", "mod": "Haiku", "dep": "A5.6, A5.7", "ent": "Entrega confirmada (C6)"}]}], "gates": [{"id": "C1", "nombre": "Datos reales", "cuando": "Una pantalla muestra lluvia diaria real de POWER para una coordenada", "sino": "Simplificar el mapa; usar Open-Meteo directo"}, {"id": "C2", "nombre": "Motor con datos", "cuando": "El motor devuelve resultados por celda con datos reales y pasa pruebas básicas", "sino": "Reducir a pilar hídrico solamente"}, {"id": "C3", "nombre": "Escena viva", "cuando": "Bloques 3D con relieve y estado coloreado desde el motor", "sino": "Plan 2D y plantas procedurales"}, {"id": "C4", "nombre": "Congelar funciones", "cuando": "Ya no entran funciones nuevas", "sino": "Recortar extras"}, {"id": "C5", "nombre": "Congelar producto", "cuando": "Solo errores y pulido", "sino": "—"}, {"id": "C6", "nombre": "Entrega lista", "cuando": "Demo, video, README y envío listos", "sino": "Respaldo local y video"}]};
const store = {get(k){try{return JSON.parse(localStorage.getItem(k)||"{}")}catch(e){return {}}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let hechas = store.get("agrohive-hechas");
let fRol = "Todos", fEsf = "Todos", fEst = "Todos", fMod = "Todos";
const roles = ["Todos","R1","R2","R3","R4"], esf = ["Todos","XS","S","M","L"], est = ["Todos","Pendientes","Hechas"], mods = ["Todos","Haiku","Sonnet","Opus","Fable"];
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function grupo(el, arr, get, set){
  arr.forEach(v=>{const b=document.createElement("button");b.textContent=v;
    if(get()===v)b.className="on";
    b.onclick=()=>{set(v);render()};el.appendChild(b)});
}
function filtros(){
  const el=document.getElementById("filtros");el.innerHTML="";
  grupo(el,roles,()=>fRol,v=>fRol=v);
  el.insertAdjacentHTML("beforeend",'<span class="sep"></span>');
  grupo(el,esf,()=>fEsf,v=>fEsf=v);
  el.insertAdjacentHTML("beforeend",'<span class="sep"></span>');
  grupo(el,mods,()=>fMod,v=>fMod=v);
  el.insertAdjacentHTML("beforeend",'<span class="sep"></span>');
  grupo(el,est,()=>fEst,v=>fEst=v);
}
function pasa(a){
  if(fRol!=="Todos" && !a.rol.includes(fRol)) return false;
  if(fEsf!=="Todos" && a.esf.replace("**","")!==fEsf && !(fEsf==="L"&&a.esf==="XL")) return false;
  if(fMod!=="Todos" && a.mod!==fMod) return false;
  if(fEst==="Pendientes" && hechas[a.id]) return false;
  if(fEst==="Hechas" && !hechas[a.id]) return false;
  return true;
}
function render(){
  filtros();
  let total=0, ok=0, html="";
  D.fases.forEach(f=>{
    f.acts.forEach(a=>{total++; if(hechas[a.id]) ok++;});
    const vis=f.acts.filter(pasa);
    html+=`<h2>${esc(f.id)} - ${esc(f.nombre)} (${f.acts.filter(a=>hechas[a.id]).length}/${f.acts.length})</h2>`;
    if(!vis.length) html+='<p class="vacio">Sin actividades con este filtro.</p>';
    vis.forEach(a=>{
      html+=`<label class="act ${hechas[a.id]?"done":""}"><input type="checkbox" data-id="${esc(a.id)}" ${hechas[a.id]?"checked":""}>
      <div><div class="t"><small>${esc(a.id)}</small>${esc(a.act)}</div>
      <div class="meta"><span class="tag">${esc(a.rol)}</span><span class="tag ${esc(a.esf)}">Esfuerzo IA: ${esc(a.esf)}</span><span class="tag mod-${esc(a.mod)}">Modelo: ${esc(a.mod)}</span></div>
      <div class="det"><b>Entregable:</b> ${esc(a.ent)}${a.dep&&a.dep!=="-"&&a.dep!=="\u2014"?` &middot; <b>Depende de:</b> ${esc(a.dep)}`:""}</div></div></label>`;
    });
  });
  document.getElementById("lista").innerHTML=html;
  const p=Math.round(ok*100/total);
  document.getElementById("barra").style.width=p+"%";
  document.getElementById("txt").textContent=`${ok} de ${total} actividades hechas (${p}%)`;
  document.querySelectorAll(".act input").forEach(i=>i.onchange=()=>{
    if(i.checked) hechas[i.dataset.id]=1; else delete hechas[i.dataset.id];
    store.set("agrohive-hechas",hechas); render();});
}
document.getElementById("gates").innerHTML=D.gates.map(g=>`<div class="gate"><b>${esc(g.id)} - ${esc(g.nombre)}</b><br>Se cruza cuando: ${esc(g.cuando)}<br>Si no: ${esc(g.sino)}</div>`).join("");
render();
</script>
</body>
</html>
